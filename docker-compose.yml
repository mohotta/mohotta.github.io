services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      target: portfolio-runner
    container_name: mohotta-portfolio
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_MODE=portfolio
      - NEXT_PUBLIC_PORTFOLIO_URL=https://mohotta.site
      - NEXT_PUBLIC_BLOG_URL=https://blog.mohotta.site
      - NEXT_PUBLIC_DOMAIN=mohotta.site
      - NEXT_PUBLIC_PORTFOLIO_DOMAIN=mohotta.site
      - NEXT_PUBLIC_BLOG_DOMAIN=blog.mohotta.site
      - NEXT_PUBLIC_API_URL=https://mohotta.site/api
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    networks:
      - web

  blog:
    build:
      context: .
      dockerfile: Dockerfile
      target: blog-runner
    container_name: mohotta-blog
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - APP_MODE=blog
      - NEXT_PUBLIC_PORTFOLIO_URL=https://mohotta.site
      - NEXT_PUBLIC_BLOG_URL=https://blog.mohotta.site
      - NEXT_PUBLIC_DOMAIN=mohotta.site
      - NEXT_PUBLIC_PORTFOLIO_DOMAIN=mohotta.site
      - NEXT_PUBLIC_BLOG_DOMAIN=blog.mohotta.site
      - NEXT_PUBLIC_API_URL=https://mohotta.site/api
      - PORT=3001
      - HOSTNAME=0.0.0.0
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    driver: bridge

